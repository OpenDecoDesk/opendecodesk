name: Test suite

on:
  push:
  pull_request:
  # Desktop builds (desktop.yml) runs this same suite before it publishes a release.
  workflow_call:

# The suite only reads the repo; never give this job write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # the suite takes about 10; run-tests.sh also stops any one file after 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (pinned to a commit, like the backup workflow)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci   # exact versions from package-lock.json
      - run: npm test
      - run: bash scripts/scan-private.sh --strict   # no keys or account ids in the tree

  # The end-to-end suite (e2e/README.md): a fresh local install driven in Playwright's Chromium. It needs no
  # keys and talks to no outside service. A desktop release runs this file, so it waits for this job too.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (pinned to a commit, like the backup workflow)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci   # exact versions from package-lock.json
      - run: npx playwright install --with-deps chromium   # the browser, and the system libraries it needs
      - run: npm run e2e
        env:
          CI: "1"            # a stray test.only fails the run
          E2E_WORKERS: "2"   # the runner has 4 cores, and each worker also drives the one local server
      # The HTML report and the traces and screenshots of the failed tests, under the run's Artifacts.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/.report
            e2e/.results
          include-hidden-files: true
          if-no-files-found: ignore
