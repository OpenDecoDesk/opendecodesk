<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Order shop</title>
<meta name="description" content="Order custom decorated apparel. Each organization gets its own shop with its own colors and pricing.">
<meta property="og:title" content="Order shop">
<meta property="og:description" content="Order custom decorated apparel. Each organization gets its own shop with its own colors and pricing.">
<meta property="og:type" content="website">
<link href="/vendor/fonts-1/fonts.css" rel="stylesheet">
<style>
  /* What the storefront (and every page) uses. A rule that can only match on an admin screen goes in admin.css,
     which loads with admin.js (review #104). */
  :root{
    --canvas: #1B1D22;
    --card: #F6F3EC;
    --card-line: #DED8C8;
    --ink: #232323;
    --ink-soft: #6b6558;
    --cream-ink: #F6F3EC;
    --accent: #1E7A4C;
    --accent-dark: #123A24;
    --accent-soft: #E7F2EB;
    --radius: 2px;
    /* Passes WCAG AA (4.5:1) against both dark backgrounds used on this
       page (--canvas #1B1D22 and the ticket panel #151619). --ink-soft
       and the darker grays below were tuned for the light card
       background only and fail contrast when reused on dark ones. */
    --dim: #999999;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--canvas);
    color:var(--cream-ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; margin:0; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  /* Buttons, links, checkboxes: a white ring with a dark band between it and the control, so the
     ring shows on the dark page and order panel (the white) and on the cream and white panels and
     boxes (the dark band) alike. A white ring alone hardly showed on the light panels. */
  :focus-visible{outline:2px solid #fff; outline-offset:3px; box-shadow:0 0 0 3px #1B1D22;}
  /* Text boxes and pick lists: the focus ring is drawn just inside the box, in the shop's (or the
     admin's) color, so it never covers a label written right above the box — a ring outside it did —
     and it shows on the light panels, where a white ring hardly did. The dark order panel keeps white. */
  input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):focus-visible,
  select:focus-visible, textarea:focus-visible{outline:2px solid var(--org-accent, var(--accent)); outline-offset:-2px; box-shadow:none;}
  .ticket input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):focus-visible,
  .ticket select:focus-visible, .ticket textarea:focus-visible{outline-color:#fff;}

  /* ---- stitch signature ---- */
  .stitch{
    height:1px;
    background-image:linear-gradient(90deg, currentColor 0 6px, transparent 6px 12px);
    background-size:12px 1px;
    opacity:.55;
    border:none;
    margin:0;
  }
  .stitch-thick{
    height:2px;
    background-image:linear-gradient(90deg, currentColor 0 8px, transparent 8px 16px);
    background-size:16px 2px;
  }

  /* ---- shell ---- */
  .shell{max-width:960px; margin:0 auto; padding:0 24px;}
  /* The storefront's 960px width is a deliberate reading-width choice for
     product copy + the 2-column cart layout — but the admin panel's order
     table has 13 columns and just needs more room, not narrower text. Only
     admin views get the wider shell (toggled in render(), index.html). */
  .shell.admin-wide{max-width:none; padding:0 16px;}
  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:28px 0 18px 0;
  }
  .brand{font-family:'Fraunces', serif; font-weight:600; font-size:20px; letter-spacing:-0.01em;}
  .brand small{display:block; font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:400; letter-spacing:.08em; text-transform:uppercase; opacity:.5; margin-top:2px;}
  /* The desktop program's name and version, small, above the business's name (applyDesktopMark_). */
  .desktop-mark{display:flex; align-items:center; gap:6px; margin-bottom:4px; font-family:'IBM Plex Sans', sans-serif; font-size:12px; font-weight:400; letter-spacing:0; color:#b9b4a8;}
  .desktop-mark img{width:18px; height:18px; display:block;}
  .desktop-mark b{font-weight:600;}
  .desktop-mark span{color:var(--dim);}
  .tag{
    position:relative;
    background:var(--card);
    color:var(--ink);
    border-radius:var(--radius);
    padding:22px 20px 20px 20px;
    text-decoration:none;
    display:block;
    transition:transform .15s ease;
  }
  .tag:hover{transform:translateY(-3px);}
  .tag::before{
    content:"";
    position:absolute; top:14px; right:16px;
    width:10px; height:10px; border-radius:50%;
    border:2px solid var(--org-accent, #1E7A4C);
  }
  .tag h3{font-size:21px; margin-top:6px; line-height:1.15; color:var(--ink);}
  .tag .status{
    margin-top:14px; font-family:'IBM Plex Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft);
  }
  .tag .status.open{color:var(--org-accent,#1E7A4C); font-weight:600;}
  .tag .stitch{margin-top:14px; color:var(--ink-soft);}

  /* ---- org page ---- */
  .org-hero{padding:20px 0 30px 0; border-bottom:none;}
  .org-eyebrow-lg{font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:color-mix(in srgb, var(--org-accent) 65%, white 35%); font-weight:600;}
  .org-hero h1{font-size:clamp(30px,5vw,44px); color:#fff; margin-top:8px;}
  .org-hero .stitch{margin-top:18px; color:var(--org-accent);}
  .org-hero p.desc{color:#a9a89e; max-width:560px; margin-top:16px; font-size:15px; line-height:1.6;}

  .not-ready{
    background:var(--card); color:var(--ink); border-radius:var(--radius);
    padding:40px 32px; margin:24px 0 60px 0; text-align:left;
  }
  .not-ready .stitch{color:var(--org-accent); margin-bottom:18px;}
  .not-ready h2{font-size:22px;}
  .not-ready p{color:var(--ink-soft); font-size:14px; margin-top:10px; line-height:1.6;}

  .layout{display:grid; grid-template-columns:1.5fr 1fr; gap:0; margin:24px 0 60px 0;}
  @media(max-width:760px){.layout{grid-template-columns:1fr;}}

  .catalog{background:var(--card); color:var(--ink); border-radius:var(--radius) 0 0 var(--radius); padding:28px;}
  @media(max-width:760px){.catalog{border-radius:var(--radius) var(--radius) 0 0;}}
  .catalog h2:not(.cat-heading){font-size:12px; text-transform:uppercase; letter-spacing:.12em; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); margin-bottom:18px; font-weight:600;}

  .cat-nav{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
  .cat-nav-link{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:.1em; text-decoration:none;
    padding:5px 12px; border-radius:20px;
    border:1px solid var(--org-accent,var(--card-line)); color:var(--org-accent,var(--ink));
    transition:background .15s,color .15s;
  }
  .cat-nav-link:hover{background:var(--org-accent,var(--card-line)); color:var(--org-accent-ink,#fff);}

  .cat-section{margin-bottom:8px;}
  .cat-heading{
    font-family:'Fraunces',serif; font-size:22px; font-weight:700;
    color:var(--ink); letter-spacing:-0.01em;
    padding:24px 0 10px 0; border-bottom:3px solid var(--org-accent,var(--accent)); margin-bottom:0;
    scroll-margin-top:16px;
  }
  .cat-section:first-child .cat-heading{padding-top:0;}

  .product{border-top:1px solid var(--card-line); padding:20px 0;}
  .product:first-of-type{border-top:none; padding-top:0;}
  .product-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .product-head h3{font-size:18px;}
  .product-price{font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; color:var(--org-accent); white-space:nowrap;}
  .product-decor{list-style:none;margin:6px 0 0;padding:0;font-size:13px;color:var(--ink);display:flex;flex-direction:column;gap:2px;}
  .product-decor li::before{content:"✦ ";color:var(--org-accent,var(--accent));}
  .product-decor .decor-kind{font-weight:600;}
  .product-desc{font-size:13px; color:var(--ink-soft); margin-top:4px; line-height:1.55; max-width:420px;}
  .feature-list{list-style:none; margin:8px 0 0 0; padding:0; display:flex; flex-direction:column; gap:3px;}
  .feature-list li{font-size:12px; color:var(--ink-soft); padding-left:14px; position:relative; line-height:1.5;}
  .feature-list li::before{content:"\2014"; position:absolute; left:0; color:var(--org-accent); font-size:11px;}

  .product-images{display:flex; gap:8px; margin-top:8px;}
  .product-images a{display:inline-block; line-height:0;}
  .product-images img{
    width:96px; height:96px; object-fit:contain; background:#fff;
    border:1px solid var(--card-line); border-radius:2px;
    transition:opacity .15s ease; cursor:zoom-in;
  }
  .product-images a:hover img{opacity:.85;}

  .design-preview{margin-bottom:8px;}
  .design-preview-imgs{display:flex; gap:12px; flex-wrap:wrap;}
  .design-preview-imgs a{display:inline-block; line-height:0;}
  .design-preview-imgs img{
    border-radius:2px; border:1px solid var(--card-line); background:#fff;
    height:150px; width:auto; object-fit:contain; transition:opacity .15s ease;
    cursor:zoom-in;
  }
  .design-preview-imgs a:hover img{opacity:.85;}
  .design-preview-caption{font-size:11px; color:var(--dim); margin-top:6px; font-family:'IBM Plex Mono',monospace;}
  .product-controls{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; align-items:center;}
  select, input[type=text], input[type=email], input[type=tel]{
    font-family:'IBM Plex Mono', monospace; font-size:13px;
    border:1px solid var(--card-line); background:#fff; color:var(--ink);
    padding:8px 10px; border-radius:var(--radius);
  }
  /* A label written as "Title<br><select>" (48 of them in the admin windows) stacks as a column, so the control can
     never ride up over its title — inline, a tall select's box could cover the text above it. */
  label:has(> br + select), label:has(> br + textarea), label:has(> br + input:not([type=checkbox]):not([type=radio])){
    display:inline-flex; flex-direction:column; align-items:flex-start; gap:3px; vertical-align:top;
  }
  label:has(> br + select) > br, label:has(> br + textarea) > br, label:has(> br + input:not([type=checkbox]):not([type=radio])) > br{display:none;}
  .qty-input{width:56px; text-align:center;}
  .add-btn{
    font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.06em;
    background:var(--org-accent); color:var(--org-accent-ink,#fff); border:none; padding:9px 16px; border-radius:var(--radius);
    font-weight:600;
  }
  .add-btn:hover{filter:brightness(1.08);}
  .stock-badge-wrap{display:block; margin-top:8px;}
  .stock-badge{display:inline-block; font-size:11px; font-weight:600; color:#166534; background:#dcfce7; border:1px solid #bbf7d0; border-radius:4px; padding:2px 8px; letter-spacing:.01em;}
  .ready-badge{display:inline-block; font-size:11px; font-weight:600; color:#1e40af; background:#dbeafe; border:1px solid #bfdbfe; border-radius:4px; padding:2px 8px; letter-spacing:.01em;}
  .personalize-row{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--ink-soft);}
  .personalize-row input[type=checkbox]{accent-color:var(--org-accent);}
  /* The customer's own design (migrations/0054): the upload box under a product or a location. */
  .cd-box{margin-top:10px; padding:10px; border:1px dashed #cfcabf; border-radius:8px; font-size:13px; color:var(--ink-soft);}
  .cd-box[hidden]{display:none;}
  .cd-head{font-weight:600; color:inherit; margin-bottom:6px;}
  .cd-file{display:block; max-width:100%; font-size:13px;}
  .cd-rules, .cd-hint{font-size:12px; margin-top:6px;}
  .cd-status{font-size:12px; margin-top:6px; min-height:1em; overflow-wrap:anywhere;}
  .cd-status.cd-err{color:#b42318;}
  .cd-status.cd-warn{color:#8a5a00;}
  .cd-preview{margin-top:6px;}
  .cd-preview a{display:inline-block; line-height:0;}
  .cd-preview img{max-width:120px; max-height:120px; object-fit:contain; border:1px solid #cfcabf; border-radius:8px; background:#fff; cursor:zoom-in;}
  .cart-line .l-desc .cd-cart{display:flex; align-items:center; gap:6px; overflow-wrap:anywhere;}
  .cart-line .l-desc .cd-cart img{width:32px; height:32px; object-fit:contain; border:1px solid #cfcabf; border-radius:4px; background:#fff; flex:none;}

  /* ---- ticket / cart panel ---- */
  .ticket{
    background:#151619; color:#F6F3EC; padding:28px; border-radius:0 var(--radius) var(--radius) 0;
    display:flex; flex-direction:column;
  }
  @media(max-width:760px){.ticket{border-radius:0 0 var(--radius) var(--radius);}}
  .ticket h2{font-size:12px; text-transform:uppercase; letter-spacing:.12em; font-family:'IBM Plex Mono',monospace; color:#8b8a82; margin-bottom:16px; font-weight:600;}
  .cart-empty{color:var(--dim); font-size:13px; padding:20px 0; font-family:'IBM Plex Mono',monospace;}
  .cart-line{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:10px 0; border-bottom:1px dashed #3a3a38;}
  .cart-line .l-desc{line-height:1.4;}
  .cart-line .l-desc small{display:block; color:#8b8a82; font-family:'IBM Plex Mono',monospace; font-size:11px; margin-top:2px;}
  .cart-line .l-price{font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
  .cfg-field-label{font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;}
  .cfg-swatches{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px;}
  .cfg-swatch{font-size:12px; padding:5px 10px; border:1px solid #cfcabf; border-radius:16px; background:#fff; cursor:pointer;}
  .cfg-swatch.sel{border-color:var(--org-accent); background:var(--org-accent); color:#fff;}
  /* Versions of a product (short / long sleeve): the toggle at the top of the card. */
  .version-toggle{margin:0 0 10px;}
  .version-toggle .cfg-swatch{font-size:13px; padding:6px 14px;}
  .cfg-locs{display:flex; flex-direction:column; gap:8px;}
  .cfg-loc-label{display:block; font-size:12px; font-weight:600;}
  .cfg-loc-select,.cfg-ink-select{width:100%; margin-top:3px;}
  .cfg-preview{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
  .cfg-prev-item{position:relative; width:72px; height:72px;}
  .cfg-prev-item a{display:block; line-height:0;}
  .cfg-prev-item img{width:72px; height:72px; object-fit:contain; border:1px solid #cfcabf; border-radius:8px; transition:opacity .15s ease; cursor:zoom-in;}
  .cfg-prev-item a:hover img{opacity:.85;}
  /* A composed mockup is a full-garment photo — show it larger and whole, not a cropped patch;
     a white background so a photo (typically shot on white) reads cleanly. */
  .cfg-prev-item.cfg-prev-mockup{width:150px; height:170px;}
  .cfg-prev-item.cfg-prev-mockup img{width:150px; height:170px; object-fit:contain; background:#fff;}
  .cfg-prev-badge{position:absolute; left:0; bottom:0; right:0; font-size:10px; text-align:center; background:rgba(0,0,0,.6); color:#fff; border-radius:0 0 8px 8px; padding:1px 0;}
  .cfg-breakdown{margin-top:8px; font-size:12px; color:var(--ink-soft);}
  .cfg-bd-row{display:flex; justify-content:space-between; gap:10px;}
  .remove-x{background:none; border:none; color:#8b8a82; font-size:14px; margin-left:8px;}
  .remove-x:hover{color:#fff;}
  .ticket-total{display:flex; justify-content:space-between; align-items:baseline; padding-top:16px; margin-top:8px; border-top:1px solid #3a3a38;}
  .ticket-total .t-label{font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#8b8a82;}
  .ticket-total .t-amount{font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:600; color:var(--org-accent);}

  .checkout-fields{margin-top:20px; display:flex; flex-direction:column; gap:10px;}
  .checkout-fields input{background:#0f1012; border:1px solid #3a3a38; color:#F6F3EC;}
  .checkout-fields input::placeholder{color:#6b6a63;}
  .place-order-btn{
    margin-top:16px; background:var(--org-accent); color:var(--org-accent-ink,#fff); border:none; padding:14px; border-radius:var(--radius);
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.08em;
  }
  .place-order-btn:disabled{background:#3a3a38; color:#6b6a63; cursor:not-allowed;}
  .place-order-btn:not(:disabled):hover{filter:brightness(1.08);}
  .form-hint{font-size:11px; color:var(--dim); margin-top:-4px; font-family:'IBM Plex Mono',monospace;}

  .confirmation{
    background:var(--card); color:var(--ink); border-radius:var(--radius); padding:40px 32px; margin:24px 0 60px 0;
  }
  .confirmation .stitch{color:var(--org-accent); margin-bottom:18px;}
  .confirmation h2{font-size:24px;}
  .order-number{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--org-accent); font-weight:600; margin-top:4px;}
  .confirmation p{color:var(--ink-soft); font-size:14px; margin-top:14px; line-height:1.6;}
  .confirmation-back{
    display:inline-block; margin-top:20px; font-family:'IBM Plex Mono',monospace; font-size:12px;
    text-transform:uppercase; letter-spacing:.06em; color:var(--org-accent); text-decoration:none; font-weight:600;
  }
  .admin-empty{color:var(--ink-soft); font-size:13px; padding:20px 0;}
  .admin-actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .admin-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    /* Fall back to --accent when a button sits outside an org panel that sets --org-accent
       (e.g. the Orders filter bar, or the All-shops table) — otherwise the background is
       invalid and the white text lands on the cream panel, unreadable. */
    background:var(--org-accent, var(--accent)); color:var(--org-accent-ink,#fff); border:none; padding:8px 14px; border-radius:var(--radius); font-weight:600;
  }
  .admin-summary{font-family:'IBM Plex Mono',monospace; font-size:13px; margin-bottom:14px; color:var(--ink-soft);}
  .admin-summary strong{color:var(--ink);}
  /* ---- admin: Users → Roles and permissions (renderRolesTab_ in admin.js) ---- */
  [data-perm-off]{display:none !important;}
  @media (max-width:760px){
    .shell.admin-wide{padding:0 10px;}
    .admin-actions .admin-btn{flex:1 1 auto;}
  }

  /* ---- print: @page at top level (not inside @media print) so all browsers honor it ---- */
  @page{size:letter;margin:0;}

  @media print{
    .org-hero,.admin-actions,.bulk-bar,.export-box,.admin-summary,#adminNav{display:none!important;}
    body{background:#fff!important;color:#000!important;}
  }

  /* Visually hidden but still announced by screen readers — used for the
     cart-update aria-live region, which has no visible presence of its
     own (the visible total already updates in the ticket panel). */
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---- toast notifications (replaces alert()) ---- */
  .toast-region{
    position:fixed; top:16px; right:16px; z-index:10050;  /* above every window (9999) and the picture viewer, so an error inside a window shows */
    display:flex; flex-direction:column; gap:8px; max-width:340px;
  }
  .toast{
    background:var(--card); color:var(--ink); border-radius:var(--radius);
    padding:12px 14px; font-size:13px; line-height:1.5; cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.35); border-left:3px solid var(--accent);
    white-space:pre-line; position:relative; padding-right:36px;
  }
  .toast-error{border-left-color:#b3261e;}
  /* The ✕ (showToast): its mark is drawn here, so the toast's text is the message alone. */
  .toast-close{
    position:absolute; top:6px; right:6px; width:26px; height:26px; padding:0;
    border:none; border-radius:4px; background:transparent; color:inherit; opacity:.7; cursor:pointer;
    font-size:18px; line-height:26px; text-align:center;
  }
  .toast-close::before{content:"\00d7";}
  .toast-close:hover, .toast-close:focus-visible{opacity:1; background:rgba(127,127,127,.18);}

  footer{padding:30px 0 50px 0; color:var(--dim); font-size:12px; font-family:'IBM Plex Mono',monospace;}
  .payment-instructions{
    margin-top:16px; background:#0f1012; border:1px solid #3a3a38;
    border-radius:var(--radius); padding:14px 16px; text-align:left;
  }
  .pi-label{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:8px;}
  .pi-value{font-size:14px; color:#F6F3EC; line-height:1.6; margin-bottom:4px;}
  .pi-note{font-size:12px; color:var(--dim); margin-top:6px; line-height:1.5;}
  .pi-discount{font-size:12px; color:#5cb87a; margin-top:8px; font-weight:600;}

  /* ---- order deadline banner ---- */
  .deadline-banner{
    display:flex; align-items:center; gap:10px;
    background:#162619; border-left:3px solid var(--org-accent, #1E7A4C);
    padding:10px 16px; font-size:13px; color:#b9d6bc;
    font-family:'IBM Plex Mono', monospace; border-radius:var(--radius);
    margin:0 0 18px 0;
  }
  .deadline-badge{
    font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    background:var(--org-accent, #1E7A4C); color:var(--org-accent-ink,#fff); padding:2px 7px; border-radius:2px;
    white-space:nowrap; flex-shrink:0;
  }
  .deadline-banner.urgent{ background:#2b1717; border-left-color:#b3261e; color:#f5c2c2; }
  .deadline-banner.urgent .deadline-badge{ background:#b3261e; }
  .deadline-banner.closed{ background:#1e1e1e; border-left-color:#5a5a55; color:var(--dim); }
  .deadline-banner.closed .deadline-badge{ background:#5a5a55; }

  /* ---- shipping / delivery section (inside ticket panel) ---- */
  .shipping-section{margin:14px 0 6px; padding-top:14px; border-top:1px dashed #3a3a38;}
  .shipping-section-label{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#8b8a82; margin-bottom:8px;}
  .shipping-option{display:flex; align-items:baseline; gap:8px; font-size:13px; padding:4px 0; cursor:pointer; font-family:'IBM Plex Mono',monospace; line-height:1.4;}
  .shipping-option input[type=radio]{flex-shrink:0; position:relative; top:1px; margin:0; accent-color:var(--org-accent);}
  .shipping-option small{color:#8b8a82; font-size:11px;}
  .shipping-zip-row{margin-top:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .shipping-zip-label{font-size:11px; color:#8b8a82; font-family:'IBM Plex Mono',monospace;}
  .shipping-zip-input{
    font-family:'IBM Plex Mono',monospace; font-size:13px; background:#0f1012;
    border:1px solid #3a3a38; color:#F6F3EC; padding:6px 10px; border-radius:var(--radius);
    width:88px;
  }
  .shipping-zip-input::placeholder{color:#6b6a63;}
  .shipping-manual-notice{margin:8px 0 4px;padding:8px 12px;background:#2a2506;border:1px solid #856b00;border-radius:4px;font-size:12px;color:#e6cc5a;line-height:1.5;font-family:'IBM Plex Mono',monospace;}
  .shipping-loading{font-size:11px; color:#8b8a82; font-family:'IBM Plex Mono',monospace;}
  /* Rush my order (migrations/0082) */
  .rush-section .shipping-option{font-weight:600;}
  .rush-note{font-size:11px; color:#8b8a82; font-family:'IBM Plex Mono',monospace; line-height:1.5; margin:2px 0 6px 24px;}
  .rush-date{margin:4px 0 2px 24px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .rush-date input{font-family:'IBM Plex Mono',monospace; font-size:13px; background:#0f1012; border:1px solid #3a3a38; color:#F6F3EC; padding:5px 8px; border-radius:var(--radius); color-scheme:dark;}
  .ticket-breakdown{padding-top:10px; margin-top:6px; border-top:1px solid #3a3a38;}
  .ticket-breakdown-line{display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:12px; color:#8b8a82; padding:2px 0;}
  /* Discount code box (migrations/0115): the code, Apply / Remove, and the server's answer under it */
  .discount-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .discount-input{width:auto; flex:1 1 140px; min-width:0; max-width:220px; text-transform:uppercase;}
  .discount-input[readonly]{opacity:.8;}
  .discount-btn{font-family:'IBM Plex Mono',monospace; font-size:12px; background:none; border:1px solid #3a3a38; color:#F6F3EC; padding:6px 12px; border-radius:var(--radius); cursor:pointer;}
  .discount-btn:disabled{opacity:.55; cursor:default;}
  .discount-on{margin-top:6px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:#86efac;}
  .discount-msg{margin-top:6px; font-size:12px; line-height:1.4; color:#fca5a5;}
  .ticket-discount-line{color:#86efac;}
  /* More than one code and gift cards at checkout (migrations/0120) */
  .discount-list{list-style:none; margin:0 0 6px; padding:0; display:flex; flex-direction:column; gap:4px;}
  .discount-chip{display:flex; align-items:center; justify-content:space-between; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:#86efac;}
  .discount-x{background:none; border:1px solid #3a3a38; color:#F6F3EC; width:26px; height:26px; line-height:1; border-radius:var(--radius); cursor:pointer; font-size:16px; flex:0 0 auto;}
  .discount-link{background:none; border:none; padding:2px 0; color:#F6F3EC; font-family:'IBM Plex Mono',monospace; font-size:12px; text-decoration:underline; cursor:pointer;}
  .gift-input{max-width:260px;}
  .ticket-gift{border-top:none; margin-top:0;}
  .ticket-gift-line{color:#86efac;}
  .ticket-topay-line{color:#F6F3EC; font-weight:600;}
  .gift-covers{color:#86efac;}
  .gift-refused{color:#b03a2e;}
  /* The shop page's "Gift cards" button and its buying form */
  .gift-buy-row{margin-top:14px;}
  .gift-buy-btn{font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.06em; background:none; border:1px solid var(--org-accent); color:var(--org-accent); padding:8px 16px; border-radius:var(--radius); cursor:pointer; font-weight:600;}
  /* The "Gift card" tile, first in the product list: laid out like a product, the whole tile opens the buying form */
  .gift-tile{display:flex; gap:16px; align-items:flex-start; padding:20px 0; cursor:pointer; color:var(--org-accent, var(--accent));}
  .gift-tile-pic{flex:0 0 auto; border-radius:8px;}
  .gift-tile-text{flex:1 1 auto; min-width:0; color:var(--ink);}
  .gift-tile-text .product-controls{margin-top:10px;}
  .cat-heading + .gift-tile{padding-top:14px;}
  @media (max-width:480px){ .gift-tile-pic{width:84px; height:53px;} }
  .gb-form{margin-top:18px; display:flex; flex-direction:column; gap:12px; max-width:480px;}
  .gb-label{font-size:13px; font-weight:600;}
  .gb-amounts{display:flex; flex-wrap:wrap; gap:8px;}
  .gb-amount{font-size:15px; font-weight:600; padding:10px 18px; border:1px solid #999; border-radius:var(--radius); background:#fff; color:#1a1a1a; cursor:pointer;}
  .gb-amount.on{background:var(--org-accent); border-color:var(--org-accent); color:#fff;}
  .gb-field{display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:600;}
  .gb-field input,.gb-field textarea{font:inherit; font-weight:400; padding:9px 10px; border:1px solid #999; border-radius:var(--radius); background:#fff; color:#1a1a1a;}
  .gb-count{font-size:11px; color:#555; text-align:right; margin-top:-8px;}
  /* Shop news and discounts (email campaigns, migrations/0117): the opt-in box under the email address */
  .marketing-optin{display:flex; gap:10px; align-items:flex-start; margin:2px 0 10px; font-size:13px; line-height:1.45; cursor:pointer; color:#F6F3EC;}
  .checkout-fields .marketing-optin input{width:16px; height:16px; min-height:0; padding:0; margin:2px 0 0; flex:0 0 auto; accent-color:var(--accent);}
  .marketing-optin-title{display:block;}
  .marketing-optin-note{display:block; font-size:12px; color:#aaa9a0; margin-top:2px;}

  /* ---- shipping address modal ---- */
  .ship-addr-overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;}
  .ship-addr-box{background:var(--card); color:var(--ink); border-radius:var(--radius); padding:24px; max-width:400px; width:100%; max-height:calc(100vh - 40px); overflow-y:auto; box-sizing:border-box;}
  .ship-addr-box h2{font-size:16px; margin:0 0 16px;}
  .ship-addr-fields{display:flex; flex-direction:column; gap:10px;}
  .ship-addr-fields input{font-family:'IBM Plex Mono',monospace; font-size:13px; border:1px solid var(--card-line); background:var(--bg); color:var(--ink); padding:8px 10px; border-radius:var(--radius); width:100%; box-sizing:border-box;}
  .ship-addr-row{display:flex; gap:8px;}
  .ship-addr-row .ship-addr-state{flex:0 0 70px; width:70px;}
  .ship-addr-row .ship-addr-zip{flex:0 0 100px; width:100px;}
  .ship-addr-row .ship-addr-city{flex:1;}
  .ship-addr-error{color:#b3261e; font-size:12px; min-height:16px; font-family:'IBM Plex Mono',monospace;}
  .ship-addr-actions{display:flex; gap:10px; margin-top:20px;}
  .ship-addr-cancel{flex:1; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; background:transparent; color:var(--ink-soft); border:1px solid var(--card-line); padding:12px; border-radius:var(--radius); cursor:pointer;}
  .ship-addr-cancel:hover{background:var(--card-line);}
  /* The overlay is appended to <body>, outside the .layout that defines --org-accent, so it sets the
     shop's accent (and a readable text colour for it) on itself — see collectShippingAddress. Without
     that the background was undefined: white text on the cream box. */
  .ship-addr-confirm{flex:2; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; background:var(--org-accent, var(--accent)); color:var(--org-accent-ink, #fff); border:none; padding:12px; border-radius:var(--radius); cursor:pointer;}
  .ship-addr-confirm:hover{filter:brightness(1.08);}

  @media (prefers-reduced-motion: reduce){
    .tag{transition:none;}
  }

  /* Invoice page (/?invoice=<token>): what's owed, how the customer will get it, how to pay. */
  .inv{max-width:680px; margin:0 auto; padding:26px 22px 40px; background:#fff; color:#1a1a1a; border-radius:8px; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:15px; line-height:1.5;}
  .inv h1{font-size:22px; margin:0 0 2px; color:var(--inv-accent,#1d4ed8);}
  .inv h2{font-size:16px; margin:26px 0 10px; padding-top:18px; border-top:1px solid #e5e7eb;}
  .inv-sub{font-size:13px; color:#555; margin-bottom:18px;}
  .inv-note{background:#f8fafc; border-left:3px solid var(--inv-accent,#1d4ed8); padding:10px 14px; white-space:pre-wrap; margin-bottom:16px; font-size:14px;}
  .inv-banner{border-radius:6px; padding:12px 16px; margin-bottom:16px; font-size:14px;}
  .inv-rush{background:#fff7ed; border:2px solid #ea580c; border-radius:6px; padding:12px 16px; margin-bottom:16px; font-size:15px; line-height:1.45; color:#431407;}
  .inv-rush .t{display:block; font-size:16px; font-weight:700; color:#9a3412; margin-bottom:4px;}
  .inv-rush .w{display:block; margin-top:6px; font-weight:700; color:#9a3412;}
  .inv-rush.passed{background:#fef2f2; border-color:#dc2626; color:#450a0a;}
  .inv-rush.passed .t, .inv-rush.passed .w{color:#991b1b;}
  .inv-rush-short{font-size:14px; font-weight:700; color:#9a3412; margin:0 0 10px;}
  .rush-payby{font-size:13px; font-weight:600; color:#9a3412; margin-top:6px;}
  .inv-ok{background:#dcfce7; border:1px solid #86efac; color:#14532d;}
  .inv-wait{background:#fef9c3; border:1px solid #fde047; color:#713f12;}
  .inv-err{color:#b03a2e; font-size:13px; min-height:18px; margin:8px 0;}
  .inv table{width:100%; border-collapse:collapse; font-size:14px;}
  .inv-items th{text-align:left; font-size:12px; color:#666; font-weight:600; padding:4px 6px; border-bottom:1px solid #e5e7eb;}
  .inv-items td{padding:6px; border-bottom:1px solid #f1f1f1; vertical-align:top;}
  .inv-items .num,.inv-totals .num{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .inv-detail{color:#666; font-size:12px;}
  .inv-totals{margin-top:10px;}
  .inv-totals td{padding:3px 6px;}
  .inv-totals .inv-total td{border-top:1px solid #ddd; padding-top:6px; font-weight:700;}
  .inv-totals .inv-due td{font-weight:700; font-size:16px;}
  .inv-tax{font-size:12px; color:#666; padding:2px 6px;}
  .inv-opt{display:flex; gap:10px; align-items:baseline; padding:7px 0; cursor:pointer;}
  .inv-opt input{flex:none; margin:0; accent-color:var(--inv-accent,#1d4ed8);}
  .inv-ship{margin:4px 0 10px 24px; padding:12px; border:1px solid #e5e7eb; border-radius:6px; background:#fafafa;}
  .inv-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px;}
  .inv-grid .full{grid-column:1/-1;}
  .inv label.f{display:block; font-size:12px; font-weight:600; color:#333;}
  .inv input[type=text]{width:100%; box-sizing:border-box; padding:8px 9px; border:1px solid #bbb; border-radius:4px; font-size:16px; margin-top:3px; background:#fff; color:#111;}
  .inv-btn{display:inline-block; padding:12px 22px; border-radius:6px; border:none; background:var(--inv-accent,#1d4ed8); color:var(--inv-accent-ink,#fff); font-size:15px; font-weight:700; cursor:pointer; text-decoration:none;}
  .inv-btn.second{background:#fff; color:#1a1a1a; border:1px solid #999; font-weight:600;}
  /* A discount code and a gift card before paying (migrations/0120) */
  .inv-addons{display:flex; flex-direction:column; gap:14px; margin-bottom:16px;}
  .inv-addon label{display:block; font-size:13px; font-weight:600; margin-bottom:4px;}
  .inv-addon-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .inv-addon-row input{flex:1 1 180px; min-width:0; max-width:300px; padding:10px; border:1px solid #999; border-radius:6px; font-size:15px; text-transform:uppercase;}
  .inv-addon-row .inv-btn{padding:10px 16px; font-size:14px;}
  .inv-totals .inv-gift td{color:#14532d;}
  .inv-btn[disabled]{opacity:.5; cursor:not-allowed;}
  .inv-btn:focus-visible,.inv-opt input:focus-visible{outline:2px solid #111; outline-offset:2px; box-shadow:none;}
  .inv-pay{display:flex; flex-direction:column; gap:12px; align-items:flex-start;}
  .inv-how{border:1px solid #e5e7eb; border-radius:6px; padding:10px 14px; font-size:14px; width:100%; box-sizing:border-box;}
  .inv-how b.t{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#666; margin-bottom:2px;}
  @media (max-width:520px){ .inv{padding:20px 14px 32px; border-radius:0;} .inv-grid{grid-template-columns:1fr;} .inv-ship{margin-left:0;} }

  /* Design approval page (/?verify=<token>): a white card like the invoice page, since the site's page
     background is dark. Colours checked for WCAG AA on white: text #1a1a1a / #555 / #b03a2e, and the
     button and box borders (#8a8a8a) at least 3:1. */
  .dv{max-width:620px; margin:24px auto 40px; padding:32px 20px; background:#fff; color:#1a1a1a; border-radius:8px; font-family:system-ui,sans-serif;}
  .dv-msg{padding:8px 0; text-align:center; color:#555;}
  .dv-msg.err, .dv-err, .dv-req, .dv-up-status.err{color:#b03a2e;}
  .dv-org{font-size:22px; font-weight:700; color:var(--dv-accent-text,#1a1a1a); margin-bottom:4px;}
  .dv-sub{font-size:13px; color:#555; margin-bottom:24px;}
  .dv-soft{color:#555;}
  .dv-banner{border-radius:6px; padding:14px 18px; margin-bottom:24px; font-size:14px; color:#1a1a1a;}
  .dv-banner.ok{background:#dcfce7; border:1px solid #86efac;}
  .dv-banner.wait{background:#fef3c7; border:1px solid #fcd34d;}
  .dv-message{font-size:15px; line-height:1.6; white-space:pre-wrap; margin-bottom:20px;}
  .dv-img{margin:12px 0;}
  .dv-img img{max-width:100%; border-radius:6px; border:1px solid #e5e7eb;}
  .dv-form{margin-top:28px; border-top:1px solid #e5e7eb; padding-top:24px;}
  .dv-h{font-size:16px; font-weight:700; margin-bottom:16px;}
  .dv-choices{display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
  .dv-choice{flex:1; min-width:140px; padding:14px 20px; border-radius:6px; border:2px solid #8a8a8a; background:#fff; color:#1a1a1a; font-size:15px; font-weight:600; cursor:pointer; transition:all .15s;}
  .dv-choice[aria-pressed="true"]{border-color:var(--dv-accent,#1d4ed8); background:var(--dv-accent,#1d4ed8); color:var(--dv-accent-ink,#fff);}
  .dv-label{display:block; font-size:13px; font-weight:600; margin-bottom:4px;}
  .dv-field{border:1px solid #8a8a8a; border-radius:4px; font-family:inherit; background:#fff; color:#1a1a1a;}
  textarea.dv-field{width:100%; box-sizing:border-box; padding:8px; font-size:14px; resize:vertical;}
  .dv-img-row{display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap;}
  .dv-img-row input[type=text]{flex:1; min-width:160px; padding:6px 8px; font-size:13px;}
  .dv-upload{position:relative; cursor:pointer;}
  .dv-upload span{display:inline-block; font-size:12px; padding:5px 10px; background:#e5e7eb; color:#1a1a1a; border-radius:4px; white-space:nowrap;}
  /* The file box itself is hidden but still takes keyboard focus; the "Upload" button shows the ring. */
  .dv-upload input:focus-visible + span{outline:2px solid #1a1a1a; outline-offset:2px;}
  .dv-up-status{font-size:12px; color:#555; min-width:50px;}
  .dv-err{font-size:13px; min-height:18px; margin-bottom:8px;}
  .dv-submit{width:100%; padding:12px 28px; background:var(--dv-accent,#1d4ed8); color:var(--dv-accent-ink,#fff); border:none; border-radius:5px; font-size:15px; font-weight:600; cursor:pointer;}
  .dv-submit[disabled]{opacity:.6; cursor:not-allowed;}
  @media (max-width:520px){ .dv{margin-top:0; border-radius:0; padding:24px 16px 32px;} }

  /* Image viewer (storefront "zoom"): near-full-screen, arrows through every picture on the product. */
  .lb-overlay{position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center;}
  .lb-box{position:relative; width:96vw; height:94vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff;}
  /* The picture is centred with margin:auto (not align/justify), so when it's zoomed past the stage the
     overflow scrolls in every direction instead of being cut off at the top and left. */
  .lb-stage{flex:1; min-height:0; width:100%; display:flex; overflow:auto; scrollbar-color:rgba(255,255,255,.5) transparent;}
  .lb-img{flex:none; margin:auto; max-width:100%; max-height:100%; object-fit:contain; background:#fff; border-radius:2px; user-select:none; -webkit-user-drag:none;}
  .lb-zoomed .lb-stage{cursor:grab;}
  .lb-zoomed .lb-stage.lb-dragging{cursor:grabbing;}
  .lb-cap{padding:10px 56px 0; font-size:14px; text-align:center; min-height:24px;}
  .lb-count,.lb-zoom{font-family:'IBM Plex Mono',monospace; font-size:12px; opacity:.75; margin-left:8px;}
  .lb-btn{position:absolute; background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:50%; width:48px; height:48px; font-size:26px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .lb-btn:hover,.lb-btn:focus-visible{background:rgba(255,255,255,.32); outline:2px solid #fff;}
  .lb-prev{left:6px; top:50%; transform:translateY(-50%);}
  .lb-next{right:6px; top:50%; transform:translateY(-50%);}
  .lb-close{right:6px; top:6px; font-size:22px;}
  .lb-zoom-in{right:62px; top:6px;}
  .lb-zoom-out{right:118px; top:6px;}
  .lb-btn:disabled{opacity:.35; cursor:default; background:rgba(255,255,255,.16); outline:none;}
  .lb-btn[hidden]{display:none;}
  /* Shopper (2026-10 usability round): the unpaid-card banner, card messages, cart steppers and the phone cart bar. */
  .unpaid-bar{margin:12px 0;padding:12px 16px;border:1px solid #f59e0b;background:#fef3c7;color:#7c2d12;border-radius:var(--radius);font-size:14px;line-height:1.5;}
  .unpaid-bar button{margin:8px 8px 0 0;font:inherit;font-weight:600;padding:8px 14px;border-radius:6px;border:1px solid #b45309;background:#b45309;color:#fff;cursor:pointer;}
  .unpaid-bar button.link{background:none;color:#7c2d12;border-color:#d6a35c;}
  .card-msg{margin-top:8px;font-size:13px;color:#b91c1c;font-weight:600;}
  .checkout-msg{margin:8px 0;padding:8px 10px;border-radius:6px;background:#fee2e2;color:#7f1d1d;font-size:13px;line-height:1.4;}
  .add-btn.added{background:#15803d;}
  .l-qty{display:flex;align-items:center;gap:6px;margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#c9c7bf;}
  .l-qty span:last-child{white-space:nowrap;}
  .qty-step{min-width:28px;height:28px;border-radius:6px;border:1px solid #55554f;background:none;color:inherit;font-size:15px;line-height:1;cursor:pointer;}
  .qty-step:hover{border-color:#fff;color:#fff;}
  .cart-bar{display:none;}
  .conf-items{text-align:left;margin:16px auto;max-width:440px;font-size:14px;}
  .conf-items .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--card-line,#ddd);}
  .conf-items .row.total{font-weight:700;border-bottom:none;}
  @media(max-width:760px){
    .product-controls select, .product-controls input, .checkout-fields input, .checkout-fields select, .cfg-loc select, .personalize-row ~ input, .personalize-row ~ select, #shipZip, .shipping-zip-input{font-size:16px;}
    .remove-x, .qty-step{min-width:44px;min-height:44px;}
    .cfg-swatch{min-height:44px;padding:8px 14px;}
    .cat-nav-link{min-height:44px;display:inline-flex;align-items:center;}
    .add-btn{min-height:44px;}
    .cart-bar{display:block;position:fixed;left:12px;right:12px;bottom:12px;z-index:60;padding:14px 16px;border:none;border-radius:10px;background:var(--ink,#1a1a18);color:#fff;font:600 16px/1.2 inherit;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;}
    .cart-bar[hidden]{display:none;}
    body.has-cart-bar .shell{padding-bottom:84px;}
  }
  .preview-bar{position:sticky;top:0;z-index:50;background:#fef3c7;color:#7c2d12;border-bottom:1px solid #f59e0b;padding:8px 16px;font-size:14px;font-weight:600;text-align:center;}
